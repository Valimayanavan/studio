
# =====================================================
# APPLICATION
# =====================================================

spring.application.name=studio_admin

# Render provides PORT automatically
server.port=${PORT:8080}
server.address=0.0.0.0


# =====================================================
# THYMELEAF
# =====================================================

spring.thymeleaf.cache=false


# =====================================================
# MYSQL DATABASE
# =====================================================
#
# The app uses plain JDBC (see models/connectionDb.java), which reads
# its settings from environment variables:
#
#   DB_URL       full JDBC url (optional, overrides the three below)
#   DB_HOST      default: localhost
#   DB_PORT      default: 3306
#   DB_NAME      default: studio_admin
#   DB_USER      default: root
#   DB_PASSWORD  default: (empty)
#
# Optional first-run admin account (only created if the admin
# table is empty):
#
#   ADMIN_USERNAME / ADMIN_PASSWORD
#
# Tables are created automatically at startup from
# src/main/resources/db/schema.sql


# =====================================================
# FILE UPLOAD
# =====================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB



