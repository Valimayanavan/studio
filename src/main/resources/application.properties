# =====================================================
# APPLICATION
# =====================================================

spring.application.name=studio_admin

# Render / Railway etc. provide PORT automatically
server.port=${PORT:8080}
server.address=0.0.0.0

# Behind a proxy (Render, Railway, Nginx) the app must trust the
# X-Forwarded-* headers, otherwise generated links (customer selection
# link) get the wrong scheme/port.
server.forward-headers-strategy=framework


# =====================================================
# THYMELEAF
# =====================================================

spring.thymeleaf.cache=false


# =====================================================
# MYSQL DATABASE
# =====================================================
#
# The app uses plain JDBC (see models/connectionDb.java). Settings are read
# from ENVIRONMENT VARIABLES first (same names as the other studio_admin
# project), and fall back to the db.* values below when a variable is not set:
#
#   DB_URL / MYSQL_URL           full JDBC url (optional, overrides host/port/name)
#   DB_HOST / MYSQLHOST          default: db.host
#   DB_PORT / MYSQLPORT          default: db.port
#   DB_NAME / MYSQLDATABASE      default: db.name
#   DB_USER / MYSQLUSER          default: db.username
#   DB_PASSWORD / MYSQLPASSWORD  default: db.password
#
# Optional first-run admin account (only created if the admin table is empty):
#
#   ADMIN_USERNAME / ADMIN_PASSWORD
#
# The database is created automatically if your MySQL user may create it, and
# all tables are created automatically at startup from
# src/main/resources/db/schema.sql

db.host=switchyard.proxy.rlwy.net
db.port=28796
db.name=railway
db.username=root
