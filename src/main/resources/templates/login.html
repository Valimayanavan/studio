<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Admin - Login</title>

    <!-- Font Awesome for modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Royal Velvet & Deep Imperial Navy Gradient */
            background: radial-gradient(circle at top left, #1d0f34, #0d1321),
            linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #2e1065 100%);
            overflow: hidden;
            position: relative;
        }

        /* =========================
           ROYAL BACKGROUND ORBS
           ========================= */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.6;
            animation: float 8s infinite ease-in-out alternate;
        }

        .circle.one {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #d4af37, #f3e5ab); /* Imperial Gold */
            top: -100px;
            left: -80px;
        }

        .circle.two {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #4c1d95, #7e22ce); /* Royal Purple */
            bottom: -150px;
            right: -100px;
            animation-delay: -3s;
        }

        .circle.three {
            width: 180px;
            height: 180px;
            background: linear-gradient(45deg, #1e3a8a, #3b82f6); /* Royal Blue */
            bottom: 15%;
            left: 8%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            100% { transform: translateY(-30px) rotate(10deg) scale(1.05); }
        }

        /* =========================
           LOGIN CARD (GLASSMORPHISM)
           ========================= */
        .login-container {
            position: relative;
            width: 420px;
            max-width: 90%;
            padding: 45px 35px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.25); /* Subtle Gold Border */
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
            0 0 25px rgba(212, 175, 55, 0.15); /* Regal Glow */
            animation: appear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           HEADER & LOGO
           ========================= */
        .logo-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
        }

        .logo {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            color: #0d1321;
            font-size: 32px;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
            transition: transform 0.4s ease;
        }

        .login-container:hover .logo {
            transform: rotate(15deg) scale(1.05);
        }

        h2 {
            text-align: center;
            color: #f8fafc;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* =========================
           ERROR MESSAGE
           ========================= */
        .error-message {
            background: rgba(225, 29, 72, 0.15);
            color: #fecdd3;
            border: 1px solid rgba(225, 29, 72, 0.4);
            border-left: 4px solid #f43f5e;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* =========================
           INPUT FIELDS
           ========================= */
        .input-group {
            margin-bottom: 22px;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            color: #64748b;
            font-size: 16px;
            transition: color 0.3s ease;
            z-index: 1;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 45px 14px 45px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 15px;
            color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input::placeholder {
            color: #64748b;
        }

        .input-wrapper input:focus {
            background: rgba(30, 41, 59, 0.9);
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
        }

        .input-wrapper input:focus + .input-icon,
        .input-wrapper input:not(:placeholder-shown) ~ .input-icon {
            color: #d4af37;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #f8fafc;
        }

        /* =========================
           ROYAL BUTTON
           ========================= */
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            color: #0f172a;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.45);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           FOOTER
           ========================= */
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer i {
            color: #d4af37;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 35px 20px;
            }
        }
    </style>
</head>

<body>

<!-- Background Orbs -->
<div class="circle one"></div>
<div class="circle two"></div>
<div class="circle three"></div>

<div class="login-container">

    <!-- Royal Crown Icon -->
    <div class="logo-container">
        <div class="logo">
            <i class="fa-solid fa-crown"></i>
        </div>
    </div>

    <h2>Studio Admin</h2>
    <p class="subtitle">Enter your credentials to access the portal</p>

    <!-- Dynamic Error Banner -->
    <div th:if="${message}" class="error-message">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${message}">Invalid username or password!</span>
    </div>

    <form action="/login" method="post" id="loginForm">

        <!-- Username Input -->
        <div class="input-group">
            <div class="input-wrapper">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" id="username" name="user_name" placeholder="Username" autocomplete="username" required>
            </div>
        </div>

        <!-- Password Input -->
        <div class="input-group">
            <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
                <button type="button" class="password-toggle" onclick="togglePassword()" id="togglePasswordBtn" aria-label="Toggle password visibility">
                    <i class="fa-solid fa-eye" id="toggleIcon"></i>
                </button>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="login-btn" id="loginButton">
            <span>Sign In</span>
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>

    </form>

    <div class="footer">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Studio Administration System</span>
    </div>

</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("toggleIcon");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.classList.remove("fa-eye");
            toggleIcon.classList.add("fa-eye-slash");
        } else {
            passwordInput.type = "password";
            toggleIcon.classList.remove("fa-eye-slash");
            toggleIcon.classList.add("fa-eye");
        }
    }

    document.getElementById("loginForm").addEventListener("submit", function () {
        const button = document.getElementById("loginButton");
        button.disabled = true;
        button.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Authenticating...</span>';
    });
</script>

</body>
</html>
