<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Lost in Space</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
            max-width: 600px;
            padding: 20px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            color: #a0aab8;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #4ecdc4;
            color: #090a0f;
            font-weight: bold;
            text-decoration: none;
            border-radius: 25px;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            background: #ff6b6b;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.4);
        }

        /* Interactive Planet Element */
        .planet-wrapper {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .planet {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #ff6b6b, #ffe66d);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -40px;
            margin-left: -40px;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
            transition: transform 0.1s ease-out;
            pointer-events: auto;
            cursor: pointer;
        }

        .planet::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 30px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
        }

        .planet:active {
            transform: scale(1.2) !important;
        }
    </style>
</head>
<body>

<div class="planet-wrapper" id="scene">
    <div class="planet" id="interactivePlanet"></div>
</div>

<div class="container">
    <div class="error-code">404</div>
    <h1>Lost in Space</h1>
    <p>The page you are looking for has drifted off into the cosmos. Move your cursor to alter the planet's orbit.</p>
    <a href="/studio_login" class="btn">Return to Earth</a>
</div>

<script>
    const planet = document.getElementById('interactivePlanet');

    document.addEventListener('mousemove', (e) => {
        const x = (e.clientX - window.innerWidth / 2) * 0.1;
        const y = (e.clientY - window.innerHeight / 2) * 0.1;
        planet.style.transform = `translate(${x}px, ${y}px)`;
    });
</script>

</body>
</html>
