<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    ```
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Albums</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            color: #222;
        }


        .header {

            background: #222;

            color: white;

            padding: 20px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 15px;
        }


        .header h1 {

            margin: 0;
        }


        .back-btn {

            background: #6c757d;

            color: white;

            text-decoration: none;

            padding: 10px 16px;

            border-radius: 7px;

            font-weight: bold;
        }


        .back-btn:hover {

            background: #555;
        }


        .container {

            width: 92%;

            max-width: 1100px;

            margin: 30px auto;
        }


        .customer-box {

            background: white;

            padding: 25px;

            border-radius: 12px;

            margin-bottom: 25px;

            box-shadow:
                    0 3px 10px rgba(0,0,0,.1);
        }


        .album-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(250px, 1fr));

            gap: 20px;
        }


        .album-card {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                    0 3px 10px rgba(0,0,0,.1);

            transition: 0.2s;
        }


        .album-card:hover {

            transform: translateY(-3px);

            box-shadow:
                    0 6px 18px rgba(0,0,0,.15);
        }


        .album-card h3 {

            margin-top: 0;
        }


        .view-btn {

            display: inline-block;

            margin-top: 15px;

            background: #007bff;

            color: white;

            text-decoration: none;

            padding: 10px 16px;

            border-radius: 7px;

            font-weight: bold;
        }


        .view-btn:hover {

            background: #0056b3;
        }


        .empty {

            background: white;

            padding: 40px;

            text-align: center;

            border-radius: 12px;

            color: #777;

            box-shadow:
                    0 3px 10px rgba(0,0,0,.1);
        }


        @media(max-width:600px) {

            .header {

                padding: 18px;
            }

            .container {

                width: 94%;
            }

        }

    </style>
</head>

<body>

<div class="header">

    <h1>
        Customer Albums
    </h1>


    <a th:href="@{'/customer_selection_manage/' + ${customer.customer_id}}"
       class="back-btn">

        ← Back to Selections

    </a>


</div>

<div class="container">


    <!-- CUSTOMER -->

    <div class="customer-box"
         th:if="${customer != null}">


        <h2 th:text="${customer.customer_name}">

            Customer Name

        </h2>


        <p>

            All albums created for this customer.

        </p>


    </div>


    <!-- NO ALBUM -->

    <div class="empty"
         th:if="${albums == null || #lists.isEmpty(albums)}">


        <h2>
            No Albums Created
        </h2>


        <p>
            Create an album from the customer's selected photos.
        </p>


    </div>


    <!-- ALBUM LIST -->

    <div class="album-grid"
         th:if="${albums != null && !#lists.isEmpty(albums)}">


        <div class="album-card"
             th:each="album : ${albums}">


            <h3 th:text="${album.album_name}">

                Album Name

            </h3>


            <p>

                Album ID:

                <strong th:text="${album.album_id}">

                    0

                </strong>

            </p>


            <a class="view-btn"
               th:href="@{'/album/' + ${album.album_id}}">

                📷 View Album

            </a>


        </div>


    </div>


</div>

</body>

</html>
